<!-- Cart Icon with Modal Trigger -->
<div
  class="cart-icon position-relative d-flex align-items-center"
  data-bs-toggle="modal"
  data-bs-target="#cartModal"
  style="cursor: pointer"
>
  <div class="position-relative me-3">
    <i class="fas fa-shopping-cart fa-2x text-primary"></i>
    <span
      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
      *ngIf="itemCount > 0"
    >
      {{ itemCount }}
    </span>
  </div>
  <div class="cart-total" *ngIf="itemCount > 0">
    <div class="text-muted small">Total:</div>
    <div class="text-success fw-bold">
      {{ cartPrice | currency : "EUR" : "symbol" : "1.2-2" }}
    </div>
  </div>
</div>

<!-- Cart Modal -->
<div
  class="modal fade"
  id="cartModal"
  tabindex="-1"
  aria-labelledby="cartModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="cartModalLabel">
          <i class="fas fa-shopping-cart me-2"></i>Your Shopping Cart
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <app-cart-detail></app-cart-detail>
      </div>
    </div>
  </div>
</div>
