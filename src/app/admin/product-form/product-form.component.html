<div class="container mt-3">
  <div class="card">
    <div class="card-header bg-primary text-white">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-0">
          <i class="fas fa-plus-circle me-2"></i>
          Add New Product
        </h5>
        <button
          type="button"
          class="btn btn-outline-light btn-sm"
          (click)="onCancel()"
        >
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <div class="card-body">
      <form #productForm="ngForm" (ngSubmit)="onSubmit()">
        <!-- Product Name -->
        <div class="mb-3">
          <label for="name" class="form-label">Product Name *</label>
          <!-- required is a validation rule. Whenever validation rule fails, the field will be marked as invalid -->
          <!-- <div *ngIf="nameField.invalid && nameField.touched">
          <span *ngIf="nameField.errors?.['required']">Name is required</span>
          <span *ngIf="nameField.errors?.['minlength']">Name must be at least 3 characters</span>
          <span *ngIf="nameField.errors?.['maxlength']">Name cannot exceed 50 characters</span>
          <span *ngIf="nameField.errors?.['pattern']">Name can only contain letters and spaces</span>
        </div> -->
          <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            [(ngModel)]="product.name"
            required
            #nameField="ngModel"
            [class.is-invalid]="nameField.invalid && nameField.touched"
          />
          <div
            class="invalid-feedback"
            *ngIf="nameField.invalid && nameField.touched"
          >
            Product name is required
          </div>
        </div>

        <!-- Category -->
        <div class="mb-3">
          <label for="category" class="form-label">Category *</label>
          <input
            type="text"
            class="form-control"
            id="category"
            name="category"
            [(ngModel)]="product.category"
            required
            #categoryField="ngModel"
            [class.is-invalid]="categoryField.invalid && categoryField.touched"
          />
          <div
            class="invalid-feedback"
            *ngIf="categoryField.invalid && categoryField.touched"
          >
            Category is required
          </div>
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea
            class="form-control"
            id="description"
            name="description"
            [(ngModel)]="product.description"
            rows="3"
          ></textarea>
        </div>

        <!-- Price -->
        <div class="mb-3">
          <label for="price" class="form-label">Price (€) *</label>
          <input
            type="number"
            class="form-control"
            id="price"
            name="price"
            [(ngModel)]="product.price"
            required
            min="0"
            step="0.01"
            #priceField="ngModel"
            [class.is-invalid]="priceField.invalid && priceField.touched"
          />
          <div
            class="invalid-feedback"
            *ngIf="priceField.invalid && priceField.touched"
          >
            <span *ngIf="priceField.errors?.['required']"
              >Price is required</span
            >
            <span *ngIf="priceField.errors?.['min']"
              >Price must be greater than 0</span
            >
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-secondary" (click)="onCancel()">
            <i class="fas fa-times me-1"></i>
            Cancel
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="productForm.invalid"
          >
            <i class="fas fa-save me-1"></i>
            Save Product
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
