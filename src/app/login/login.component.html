<div class="login-container">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5">
            <!-- Header -->
            <div class="text-center mb-4">
              <i class="fas fa-dumbbell fa-3x text-primary mb-3"></i>
              <h2 class="card-title fw-bold text-primary mb-2">Welcome Back</h2>
              <p class="text-muted">Sign in to your Sports Store account</p>
            </div>

            <!-- Login Form -->
            <form (ngSubmit)="login()">
              <div class="form-floating mb-3">
                <input
                  type="text"
                  class="form-control rounded-3"
                  id="usernameInput"
                  [(ngModel)]="username"
                  name="username"
                  placeholder="Username"
                  required
                  aria-label="Username"
                />
                <label for="usernameInput">
                  <i class="fas fa-user me-2"></i>Username
                </label>
              </div>

              <div class="form-floating mb-4">
                <input
                  type="password"
                  class="form-control rounded-3"
                  id="passwordInput"
                  [(ngModel)]="password"
                  name="password"
                  placeholder="Password"
                  required
                  aria-label="Password"
                />
                <label for="passwordInput">
                  <i class="fas fa-lock me-2"></i>Password
                </label>
              </div>

              <div class="d-grid gap-2 mb-3">
                <button
                  class="btn btn-primary btn-lg rounded-3 py-3"
                  type="submit"
                >
                  <i class="fas fa-sign-in-alt me-2"></i>
                  Sign In
                </button>
              </div>

              <!-- Error Message -->
              <div
                *ngIf="error"
                class="alert alert-danger rounded-3 d-flex align-items-center"
              >
                <i class="fas fa-exclamation-triangle me-2"></i>
                {{ error }}
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
