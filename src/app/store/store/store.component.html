<div class="container-fluid mt-4">
  <div class="row">
    <!-- Categories Sidebar -->
    <div class="col-md-3 col-lg-2 category-sidebar p-3">
      <h5 class="mb-3">Categories</h5>
      <div class="list-group">
        <button
          class="list-group-item list-group-item-action"
          [class.active]="selectedCategory === ''"
          (click)="changeCategory('')"
        >
          All Products
        </button>
        <button
          *ngFor="let category of categories"
          class="list-group-item list-group-item-action"
          [class.active]="selectedCategory === category"
          (click)="changeCategory(category)"
        >
          {{ category }}
        </button>
      </div>
    </div>

    <!-- Main Content Area Products -->
    <div class="col-md-9 col-lg-7">
      <!-- Header with Cart -->
      <div
        class="sports-store-header d-flex justify-content-between align-items-center mb-4 p-3 shadow-sm rounded"
      >
        <h2 class="mb-0">Sports Store <i class="fa-solid fa-futbol"></i></h2>
        <div class="d-flex align-items-center" *ngIf="isLoggedIn">
          <button
            mat-raised-button
            color="primary"
            class="me-4"
            (click)="showProductForm()"
          >
            Add new product
          </button>
          <app-cart-summary></app-cart-summary>
        </div>
      </div>

      <!-- Products Grid -->
      <ng-container *ngIf="!showPform">
        <div class="row">
          <div
            class="col-lg-3 col-md-4 col-sm-6 mb-4"
            *ngFor="let product of products"
          >
            <app-product-card
              [product]="product"
              (productAdded)="addProductToCart($event)"
            >
            </app-product-card>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="showPform">
        <app-product-form (closeForm)="showPform = false"></app-product-form>
      </ng-container>

      <!-- Pagination -->
      <ng-container *ngIf="!showPform">
        <div class="d-flex justify-content-center mt-4" *ngIf="totalPages > 1">
          <nav>
            <ul class="pagination">
              <li class="page-item" [class.disabled]="selectedPage === 1">
                <button
                  class="page-link"
                  (click)="changePage(selectedPage - 1)"
                >
                  Previous
                </button>
              </li>
              <li
                class="page-item"
                *ngFor="let page of getPages()"
                [class.active]="page === selectedPage"
              >
                <button class="page-link" (click)="changePage(page)">
                  {{ page }}
                </button>
              </li>
              <li
                class="page-item"
                [class.disabled]="selectedPage === totalPages"
              >
                <button
                  class="page-link"
                  (click)="changePage(selectedPage + 1)"
                >
                  Next
                </button>
              </li>
            </ul>
          </nav>
        </div>
      </ng-container>
    </div>
    <div class="col-md-3">
      <!-- Your AD here -->
      <div class="ad-section p-3 rounded shadow-sm">
        <h5 class="mb-3">Advertisement</h5>
        <p>Place your ad here!</p>
        <img
          src="../../../assets/your_add_here.png"
          alt="Ad"
          class="img-fluid rounded"
        />
      </div>
    </div>
  </div>
</div>
