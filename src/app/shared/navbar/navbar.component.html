<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <!-- Brand -->
    <a class="navbar-brand fw-bold" href="#">
      <i class="fas fa-dumbbell me-2"></i>
      Sports Store
    </a>

    <!-- Mobile toggle button -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navigation items -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item" *ngFor="let item of navbarItems">
          <a
            class="nav-link"
            [class.active]="activeRoute === item.route"
            (click)="setActiveRoute(item.route)"
          >
            <i [class]="item.icon"></i>
            {{ item.name }}
          </a>
        </li>
      </ul>

      <!-- Right side navigation -->
      <ul class="navbar-nav">
        <!-- Authentication buttons -->
        <li class="nav-item" *ngIf="!isLoggedIn">
          <a class="nav-link" (click)="login()">
            <i class="fas fa-sign-in-alt me-1"></i>
            Login
          </a>
        </li>
        <li class="nav-item dropdown" *ngIf="isLoggedIn">
          <a
            class="nav-link dropdown-toggle"
            href="#"
            id="navbarDropdown"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="fas fa-user me-1"></i>
            {{ currentUser?.username || currentUser?.email || "User" }}
          </a>
          <ul
            class="dropdown-menu dropdown-menu-end"
            aria-labelledby="navbarDropdown"
          >
            <li>
              <a class="dropdown-item" (click)="viewProfile()">
                <i class="fas fa-user-circle me-2"></i>
                Profile
              </a>
            </li>
            <li>
              <a class="dropdown-item" (click)="viewOrders()">
                <i class="fas fa-receipt me-2"></i>
                My Orders
              </a>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <a class="dropdown-item" (click)="logout()">
                <i class="fas fa-sign-out-alt me-2"></i>
                Logout
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
