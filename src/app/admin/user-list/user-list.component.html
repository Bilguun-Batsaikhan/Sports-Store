<div class="container-fluid">
  <div class="col-md-12 col-lg-12">
    <div
      class="d-flex align-items-center justify-content-start mb-4 p-3 bg-white shadow-sm rounded"
    >
      <h2 class="mb-0">List of Users <i class="fa-solid fa-users"></i></h2>

      <div class="text-center w-75">
        <input
          type="text"
          placeholder="Filter by role"
          (input)="updateFilter($event)"
          class="form-control w-50 mx-auto border border-primary-subtle"
        />
      </div>
      <button mat-raised-button color="primary" (click)="openDialog()">
        Add New User
      </button>
    </div>

    <!-- Main Content Row -->
    <div class="row mx-4 mt-4">
      <!-- Users Grid -->
      <div class="col-md-12">
        <div class="row">
          <div
            class="col-lg-2 col-md-4 col-sm-6 mb-4"
            *ngFor="let user of filteredUsers"
          >
            <app-user-card
              [user]="user"
              (userAddedtoGold)="onUserAdded($event)"
            >
            </app-user-card>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
