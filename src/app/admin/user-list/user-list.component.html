<app-navbar></app-navbar>
<div class="container-fluid">
  <div class="col-md-12 col-lg-12">
    <div
      class="d-flex justify-content-between align-items-center mb-4 p-3 bg-white shadow-sm rounded"
    >
      <h2 class="mb-0">List of Clients <i class="fa-solid fa-users"></i></h2>
      <div class="text-center w-50">
        <input
          type="text"
          placeholder="Filter by role"
          (input)="updateFilter($event)"
          class="form-control w-50 mx-auto"
        />
      </div>
    </div>

    <!-- Users Grid -->
    <div class="row">
      <div
        class="col-lg-3 col-md-4 col-sm-6 mb-4"
        *ngFor="let user of filteredUsers"
      >
        <app-user-card [user]="user" (userAdded)="onUserAdded($event)">
        </app-user-card>
      </div>
    </div>
