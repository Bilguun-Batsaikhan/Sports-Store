<app-navbar></app-navbar>
<div class="container-fluid">
  <div class="row">
    <!-- Categories Sidebar -->
    <div class="col-md-3 col-lg-2 bg-light p-3">
      <h5 class="mb-3">Categories</h5>
      <div class="list-group">
        <button
          class="list-group-item list-group-item-action"
          [class.active]="selectedCategory === ''"
          (click)="changeCategory('')"
        >
          All Products
        </button>
        <button
          *ngFor="let category of categories"
          class="list-group-item list-group-item-action"
          [class.active]="selectedCategory === category"
          (click)="changeCategory(category)"
        >
          {{ category }}
        </button>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="col-md-9 col-lg-10">
      <!-- Header with Cart -->
      <div
        class="d-flex justify-content-between align-items-center mb-4 p-3 bg-white shadow-sm rounded"
      >
        <h2 class="mb-0">
          Sports Store <i class="fa-solid fa-futbol text-primary"></i>
        </h2>
        <app-cart-summary></app-cart-summary>
      </div>

      <!-- Products Grid -->
      <div class="row">
        <div
          class="col-lg-3 col-md-4 col-sm-6 mb-4"
          *ngFor="let product of products"
        >
          <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title text-primary">{{ product.name }}</h5>
              <p class="card-text text-muted">{{ product.description }}</p>
              <div class="mt-auto">
                <p class="card-text">
                  <strong class="text-success fs-4">{{
                    product.price | currency : "EUR" : "symbol" : "1.2-2"
                  }}</strong>
                </p>
                <button
                  class="btn btn-primary w-100"
                  (click)="addProductToCart(product)"
                >
                  <i class="fas fa-cart-plus me-2"></i>Add to Cart
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Pagination -->
      <div class="d-flex justify-content-center mt-4" *ngIf="totalPages > 1">
        <nav>
          <ul class="pagination">
            <li class="page-item" [class.disabled]="selectedPage === 1">
              <button class="page-link" (click)="changePage(selectedPage - 1)">
                Previous
              </button>
            </li>
            <li
              class="page-item"
              *ngFor="let page of getPages()"
              [class.active]="page === selectedPage"
            >
              <button class="page-link" (click)="changePage(page)">
                {{ page }}
              </button>
            </li>
            <li
              class="page-item"
              [class.disabled]="selectedPage === totalPages"
            >
              <button class="page-link" (click)="changePage(selectedPage + 1)">
                Next
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>
